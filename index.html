<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Premium Core Reset & Fluid Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient, True OLED Black Deep Space Layout */
        html, body {
            background-color: #050505;
            color: #ffffff;
            width: 100%;
            min-height: 100%;
            /* Fixes scrolling blocks on Android */
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        /* Using modern grid instead of flex to fix landscape centering bugs */
        body {
            display: grid;
            place-items: center;
            align-content: center;
            padding: 60px 24px;
            position: relative;
        }

        /* Fixed Interactive Canvas for Ambient Magic Background */
        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Sophisticated, Controlled Container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 310px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Luxury Logo Component with Dual-Layer Ambient Halo */
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 36px;
        }

        .avatar-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0.02;
            filter: blur(12px);
            animation: pulse-halo 4s ease-in-out infinite;
        }

        .avatar {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background-color: #121214;
            object-fit: cover;
            transition: border-color 0.4s ease;
        }

        /* Tight, Consistent Link Layout */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* High-End Glassmorphic Interactive Buttons */
        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-decoration: none;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            cursor: pointer;
            transition: 
                background-color 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                border-color 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                transform 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                box-shadow 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                color 0.3s ease;
            
            -webkit-tap-highlight-color: transparent; 
        }

        /* Multi-Angle Premium Shimmer Layer (Glitter Effect) */
        .link-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -100%;
            width: 30%;
            height: 200%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.18) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(35deg);
        }

        /* Strictly Hover-Only Enhancements (Mouse Users) */
        @media (hover: hover) {
            .link-btn:hover {
                background-color: rgba(255, 255, 255, 0.07);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
                color: #ffffff;
            }

            .link-btn:hover::before {
                animation: premium-shimmer 1.4s infinite cubic-bezier(0.25, 1, 0.5, 1);
            }
            
            .avatar-container:hover .avatar {
                border-color: rgba(255, 255, 255, 0.3);
            }
        }

        /* Mobile Touch Click-Down Feedback State */
        .link-btn:active {
            transform: scale(0.97) translateY(0);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transition: transform 0.1s ease;
        }

        /* SOPHISTICATED TIMELINES */
        @keyframes premium-shimmer {
            0% { left: -100%; }
            100% { left: 150%; }
        }

        @keyframes pulse-halo {
            0%, 100% { transform: scale(1); opacity: 0.02; }
            50% { transform: scale(1.15); opacity: 0.05; filter: blur(16px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="ambient-canvas"></canvas>

    <div class="container">
        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <img class="avatar" src="https://github.com/achleitner.png" alt="Logo">
        </div>
        
        <div class="links-stack">
            <a href="https://github.com/achleitner" class="link-btn" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://instagram.com/kingstrapscom" class="link-btn" target="_blank" rel="noopener noreferrer">@kingstrapscom</a>
            <a href="https://instagram.com/kingfluxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="link-btn" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="link-btn" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="link-btn" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            // Forces Android Chrome to recalculate size after structural rotation completes
            setTimeout(resizeCanvas, 200);
        });
        resizeCanvas();

        class SparkleParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = -Math.random() * 0.2 - 0.05;
                this.alpha = Math.random();
                this.fadeSpeed = Math.random() * 0.008 + 0.003;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0 || this.y < 0) {
                    this.x = Math.random() * canvas.width;
                    this.y = window.innerHeight + 10;
                    this.alpha = Math.random();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new SparkleParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>

</body>
</html>
