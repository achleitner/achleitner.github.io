<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Core Reset & Non-Serif Typography */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        /* Fluid Layout Matrix */
        html, body { 
            background-color: #050505; 
            color: #ffffff; 
            width: 100%; 
            min-height: 100%; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        body { 
            display: grid; 
            place-items: center; 
            align-content: center; 
            padding: 60px 24px; 
        }

        /* Minimalist Display Container */
        .container { 
            text-align: center; 
            max-width: 310px; 
            width: 100%; 
            margin: 0 auto; 
        }

        /* Centered Avatar Component */
        .avatar { 
            width: 88px; 
            height: 88px; 
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            background-color: #121214; 
            object-fit: cover; 
            margin-bottom: 36px;
        }

        /* Clean Interface Stack */
        .links-stack { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        /* Matte Flat Mobile-Optimized Buttons */
        .link-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 15px 20px; 
            background: rgba(255, 255, 255, 0.03); 
            color: rgba(255, 255, 255, 0.75); 
            font-size: 0.92rem; 
            font-weight: 400; 
            letter-spacing: 0.01em; 
            text-decoration: none; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            cursor: pointer; 
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Subtle Matte Hover Interaction Box */
        @media (hover: hover) {
            .link-btn:hover { 
                background-color: rgba(255, 255, 255, 0.08); 
                border-color: rgba(255, 255, 255, 0.18); 
                color: #ffffff; 
            }
        }

        /* Snappy Snug Click State */
        .link-btn:active { 
            background-color: rgba(255, 255, 255, 0.01); 
            border-color: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="avatar" src="https://github.com/achleitner.png" alt="Logo">
        
        <div class="links-stack">
            <a href="https://github.com/achleitner" class="link-btn" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://instagram.com/kingstrapscom" class="link-btn" target="_blank" rel="noopener noreferrer">@kingstrapscom</a>
            <a href="https://instagram.com/kingfluxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="link-btn" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="link-btn" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="link-btn" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </div>
    </div>

</body>
</html>
