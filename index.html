<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Links</title>
    <style>
        /* Premium Core Reset & Fluid Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient, True OLED Black Canvas */
        html, body {
            background-color: #050505;
            color: #ffffff;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        body {
            display: grid;
            place-items: center;
            align-content: center;
            padding: 60px 24px;
            position: relative;
        }

        /* PURE CSS BACKGROUND SPARKLES (Layer 1 - Small Stars) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            background: transparent;
            /* Generates random coordinates across the space */
            box-shadow: 
                12vw 15vh #fff, 85vw 32vh rgba(255,255,255,0.4), 45vw 78vh #fff, 
                23vw 62vh rgba(255,255,255,0.7), 68vw 12vh #fff, 91vw 85vh rgba(255,255,255,0.3),
                5vw 40vh #fff, 73vw 55vh rgba(255,255,255,0.8), 33vw 22vh #fff,
                55vw 67vh rgba(255,255,255,0.5), 18vw 90vh #fff, 80vw 70vh rgba(255,255,255,0.6);
            z-index: 1;
            animation: css-glitter-slow 6s ease-in-out infinite alternate;
        }

        /* PURE CSS BACKGROUND SPARKLES (Layer 2 - Micro Stars) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 1.5px;
            height: 1.5px;
            background: transparent;
            box-shadow: 
                30vw 10vh rgba(255,255,255,0.8), 75vw 80vh #fff, 10vw 70vh rgba(255,255,255,0.4),
                60vw 40vh #fff, 88vw 15vh rgba(255,255,255,0.9), 40vw 92vh #fff,
                50vw 25vh rgba(255,255,255,0.5), 95vw 50vh #fff, 25vw 35vh rgba(255,255,255,0.7);
            z-index: 1;
            animation: css-glitter-fast 4s ease-in-out infinite alternate;
        }

        /* Sophisticated, Controlled Container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 310px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Luxury Logo Component with Dual-Layer Ambient Halo */
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 36px;
        }

        .avatar-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0.02;
            filter: blur(12px);
            animation: pulse-halo 4s ease-in-out infinite;
        }

        .avatar {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background-color: #121214;
            object-fit: cover;
            transition: border-color 0.4s ease;
        }

        /* Tight, Consistent Link Layout */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* High-End Glassmorphic Interactive Buttons */
        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-decoration: none;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            cursor: pointer;
            transition: 
                background-color 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                border-color 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                transform 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                box-shadow 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                color 0.3s ease;
            
            -webkit-tap-highlight-color: transparent; 
        }
