<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Core Reset & Non-Serif Typography */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        /* Fluid Layout Matrix */
        html, body { 
            background-color: #050505; 
            color: #ffffff; 
            width: 100%; 
            min-height: 100%; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        body { 
            display: grid; 
            place-items: center; 
            align-content: center; 
            padding: 60px 24px; 
        }

        /* Minimalist Display Container */
        .container { 
            text-align: center; 
            max-width: 310px; 
            width: 100%; 
            margin: 0 auto; 
        }

        /* Centered Avatar Component */
        .avatar { 
            width: 88px; 
            height: 88px; 
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background-color: #121214; 
            object-fit: cover; 
            margin-bottom: 36px;
        }

        /* Clean Interface Stack */
        .links-stack { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; /* Slightly increased gap to allow room for outer glows */
        }

        /* Premium Rainbow Glowing Buttons */
        .link-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 16px 20px; 
            background: #0d0d10;
            color: #ffffff;
            font-size: 0.94rem; 
            font-weight: 500; 
            letter-spacing: 0.01em; 
            text-decoration: none; 
            border-radius: 12px; 
            cursor: pointer; 
            position: relative;
            z-index: 1;
            
            /* Attaches the rainbow hue cycle and fade timelines directly */
            animation: rainbow-glow 8s linear infinite, fade-pulse 6s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent; 
        }

        /* Staggered animation delays to make the cycles shift randomly */
        .links-stack a:nth-child(1) { animation-delay: 0.0s, 0.5s; }
        .links-stack a:nth-child(2) { animation-delay: -1.5s, -2.0s; }
        .links-stack a:nth-child(3) { animation-delay: -3.0s, -1.0s; }
        .links-stack a:nth-child(4) { animation-delay: -4.5s, -3.5s; }
        .links-stack a:nth-child(5) { animation-delay: -2.0s, -5.0s; }
        .links-stack a:nth-child(6) { animation-delay: -6.0s, -1.5s; }
        .links-stack a:nth-child(7) { animation-delay: -3.5s, -0.0s; }

        /* TIMELINE 1: Slow Rainbow Hue & Border Rotation */
        @keyframes rainbow-glow {
            0% {
                border: 1px solid #ff3366;
                box-shadow: 0 0 12px rgba(2ff, 51, 102, 0.35);
            }
            20% {
                border: 1px solid #ff9933;
                box-shadow: 0 0 12px rgba(255, 153, 51, 0.35);
            }
            40% {
                border: 1px solid #33cc66;
                box-shadow: 0 0 12px rgba(51, 204, 102, 0.35);
            }
            60% {
                border: 1px solid #3399ff;
                box-shadow: 0 0 12px rgba(51, 153, 255, 0.35);
            }
            80% {
                border: 1px solid #9933ff;
                box-shadow: 0 0 12px rgba(153, 51, 255, 0.35);
            }
            100% {
                border: 1px solid #ff3366;
                box-shadow: 0 0 12px rgba(255, 51, 102, 0.35);
            }
        }

        /* TIMELINE 2: Ambient Brightness Breathing Fade (In & Out) */
        @keyframes fade-pulse {
            0%, 100% {
                opacity: 0.65;
                filter: brightness(0.8) contrast(0.9);
            }
            50% {
                opacity: 1;
                filter: brightness(1.2) contrast(1.1);
            }
        }

        /* Responsive Mobile Touch Feedback Scaling */
        .link-btn:active { 
            transform: scale(0.97);
            filter: brightness(0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="avatar" src="https://github.com/achleitner.png" alt="Logo">
        
        <div class="links-stack">
            <a href="https://github.com/achleitner" class="link-btn" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://instagram.com/kingstrapscom" class="link-btn" target="_blank" rel="noopener noreferrer">@kingstrapscom</a>
            <a href="https://instagram.com/kingfluxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="link-btn" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="link-btn" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="link-btn" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </div>
    </div>

</body>
</html>
