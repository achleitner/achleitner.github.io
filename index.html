<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ACHLEITNER</title>
    <style>
        /* Modern Reset & Fluid Monospace Archetype */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* FIXED: Softened canvas from stark #000000 to a premium deep charcoal matte background */
        html, body { 
            background-color: #0a0a0a;
            color: #FFFFFF; 
            width: 100%; 
            min-height: 100%; 
            overflow-x: hidden;
            overflow-y: auto;
        }

        body { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(80px, 15vh, 160px) 24px 60px 24px;
            
            /* FIXED: Expanded and softened the radial gradient ambient lighting to reduce harsh contrast */
            background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.04) 0%, rgba(10, 10, 10, 0) 60%);
        }

        /* Monolith Wrapper */
        .directory-wrapper { 
            position: relative;
            text-align: center; 
            max-width: 320px; 
            width: 100%; 
            margin: auto 0;
            animation: premiumEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Identity Token Frame */
        .avatar-assembly {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 80px;
            margin-bottom: 56px;
            background: #0a0a0a; /* Updated to match new base background */
            border-radius: 50%;
            isolation: isolate;
            overflow: hidden;
            /* Subtle high-end rim lighting shadow */
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .identity-avatar { 
            display: block;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(1) contrast(1.3) brightness(1.05);
            mix-blend-mode: screen; 
            
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .avatar-assembly:hover .identity-avatar {
            transform: scale(1.08);
        }

        /* Typographic Interactive Node Matrix */
        .links-matrix { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            margin-bottom: 72px;
        }

        .interactive-node { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 12px 0; 
            background: transparent;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.84rem; 
            font-weight: 400; 
            letter-spacing: 0.14em; 
            text-transform: lowercase; 
            text-decoration: none; 
            position: relative;
            -webkit-tap-highlight-color: transparent;   
            transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        text-shadow 0.4s ease;
        }

        /* Dynamic Blurring Hover Effect Map */
        @media (hover: hover) {
            .interactive-node:hover { 
                color: #FFFFFF;
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            }

            /* Dim alternative items slightly when hovering one to draw focus */
            .links-matrix:hover .interactive-node:not(:hover) {
                opacity: 0.25;
            }
        }

        .interactive-node:active { 
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.1s ease;
        }

        /* Pure Typographic Footer Platform */
        .premium-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .divider-line {
            width: 16px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .contact-node {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .contact-node:hover {
                color: rgba(255, 255, 255, 0.75);
            }
        }

        /* Premium Smooth Kinematic Entry Animation */
        @keyframes premiumEntry {
            from { 
                opacity: 0; 
                filter: blur(8px) brightness(0.5);
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                filter: blur(0) brightness(1);
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>

    <div class="directory-wrapper">
        <header>
            <div class="avatar-assembly">
                <img class="identity-avatar" src="https://github.com/achleitner.png" alt="Identity Avatar">
            </div>
        </header>
        
        <main class="links-matrix">
            <a href="https://github.com/achleitner" class="interactive-node" target="_blank" rel="noopener noreferrer">github</a>
            <a href="https://instagram.com/kingstrapscom" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingstraps</a>
            <a href="https://instagram.com/kingfluxx.x" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="interactive-node" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </main>

        <footer class="premium-footer">
            <div class="divider-line"></div>
            <a href="mailto:github@achleitner.de" class="contact-node">github@achleitner.de</a>
        </footer>
    </div>

</body>
</html>
