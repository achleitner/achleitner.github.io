<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Modern reset & non-serif fonts */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Deep dark minimalist background */
        body {
            background-color: #0b0b0c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Centered button container */
        .container {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        /* Profile image with a subtle breathing pulse animation */
        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: #161618;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
            animation: breathe 4s ease-in-out infinite;
        }

        /* Vertical link stack */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Premium sleek buttons equipped for shimmer/glitter effects */
        .link-btn {
            position: relative;
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #161618;
            color: #efeff1;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden; /* Keeps the glitter/shimmer effect confined inside the button border */
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* The Glitter/Shimmer Layer */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15) 50%, 
                transparent
            );
            transform: skewX(-25deg);
        }

        /* Cool Hover Effects */
        .link-btn:hover {
            background-color: #1c1c1f;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px); /* Slight lift */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Trigger the glitter flash loop on hover */
        .link-btn:hover::before {
            animation: sparkle-glide 1.2s ease-in-out infinite;
        }

        /* Active click/touch down state */
        .link-btn:active {
            transform: translateY(0);
            background-color: #141416;
        }

        /* ANIMATION TIMELINES */
        
        /* The sparkle/glitter movement across the face of the button */
        @keyframes sparkle-glide {
            0% {
                left: -150%;
            }
            100% {
                left: 150%;
            }
        }

        /* Logo pulse glow */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.3);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="avatar" src="https://github.com/achleitner.png" alt="Logo">
        
        <div class="links-stack">
            <a href="https://github.com/achleitner" class="link-btn" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://instagram.com/kingstrapscom" class="link-btn" target="_blank" rel="noopener noreferrer">@kingstrapscom</a>
            <a href="https://instagram.com/kingfluxxx" class="link-btn" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchainz" class="link-btn" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingtraxxx" class="link-btn" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
        </div>
    </div>

</body>
</html>
