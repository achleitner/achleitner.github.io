<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>achleitner.de</title>
    <style>
        /* Agency Core Reset & Optimization Matrix */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* The Canvas: Pure, Flat OLED Pitch Black */
        html, body { 
            background-color: #000000;
            color: #FFFFFF; 
            width: 100%; 
            min-height: 100%; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        body { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(40px, 6vh, 80px) 24px 60px 24px;
        }

        /* Strict UI Structural Container */
        .directory-wrapper { 
            position: relative;
            text-align: center; 
            max-width: 315px; 
            width: 100%; 
            margin: 0 auto; 
            animation: flatEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Clean Profile Container */
        .avatar-assembly {
            position: relative;
            display: inline-block;
            margin-bottom: 48px;
        }

        .identity-avatar { 
            width: 84px; 
            height: 84px; 
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background-color: #09090B; 
            object-fit: cover; 
        }

        /* Strict Flex Stack Layout */
        .links-matrix { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-bottom: 56px;
        }

        /* Pure Matte Minimalist Slabs */
        .interactive-node { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 16px 24px; 
            background: #141416; /* Solid, premium matte charcoal block */
            color: rgba(255, 255, 255, 0.7);      
            font-size: 0.9rem; 
            font-weight: 500; 
            letter-spacing: 0.04em; 
            text-transform: lowercase; 
            text-decoration: none; 
            border-radius: 6px; /* Architectural sharp corner profile */
            border: none;
            cursor: pointer; 
            position: relative;
            transform: translateZ(0); 
            -webkit-tap-highlight-color: transparent; 
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Subtle Desktop Matte Contrast Shifting */
        @media (hover: hover) {
            .interactive-node:hover { 
                background-color: #1D1D20; /* Steps up opacity cleanly without movement */
                color: #FFFFFF; 
            }
        }

        /* Tactile Press State */
        .interactive-node:active { 
            background-color: #0E0E10; 
            color: rgba(255, 255, 255, 0.4);
            transition: background-color 0.05s ease;
        }

        /* Minimal Footer Architecture */
        .premium-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Pure Geometric Vector Code Icon Structure */
        .vector-bracket {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #232326; 
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Clean Technical Communication Endpoint Link */
        .contact-node {
            color: #38383C;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.25s ease;
        }

        @media (hover: hover) {
            .contact-node:hover {
                color: #71717A;
            }
        }

        /* Snappy Direct Entry Animation */
        @keyframes flatEntry {
            from { 
                opacity: 0; 
                transform: translateY(8px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>

    <div class="directory-wrapper">
        <div class="avatar-assembly">
            <img class="identity-avatar" src="https://github.com/achleitner.png" alt="Identity Avatar">
        </div>
        
        <div class="links-matrix">
            <a href="https://github.com/achleitner" class="interactive-node" target="_blank" rel="noopener noreferrer">github</a>
            <a href="https://instagram.com/kingstrapscom" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingstraps</a>
            <a href="https://instagram.com/kingfluxx.x" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="interactive-node" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="interactive-node" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </div>

        <footer class="premium-footer">
            <svg class="vector-bracket" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <a href="mailto:github@achleitner.de" class="contact-node">github@achleitner.de</a>
        </footer>
    </div>

</body>
</html>
