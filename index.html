<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Modern Reset & System Fonts */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Dark Mesh Gradient Background */
        html, body { 
            background-color: #050506;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 51, 102, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(51, 153, 255, 0.04) 0px, transparent 50%);
            color: #ffffff; 
            width: 100%; 
            min-height: 100%; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        body { 
            display: grid; 
            place-items: center; 
            align-content: center; 
            padding: 60px 24px; 
        }

        /* Controlled Container */
        .container { 
            text-align: center; 
            max-width: 320px; 
            width: 100%; 
            margin: 0 auto; 
        }

        /* Sleek Avatar Component */
        .avatar { 
            width: 92px; 
            height: 92px; 
            border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background-color: #121214; 
            object-fit: cover; 
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* Interface Stack Layout */
        .links-stack { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }

        /* High-Visibility Premium Charcoal Buttons */
        .link-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 16px 24px; 
            /* FIXED: Bumped background color up to a visible dark charcoal titanium shade */
            background: rgba(255, 255, 255, 0.07); 
            color: rgba(255, 255, 255, 0.9);      
            font-size: 0.94rem; 
            font-weight: 500; 
            letter-spacing: 0.03em; 
            text-transform: lowercase; 
            text-decoration: none; 
            border-radius: 16px; 
            /* FIXED: Strengthened border line alpha so boundaries pop instantly */
            border: 1px solid rgba(255, 255, 255, 0.14); 
            cursor: pointer; 
            position: relative;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: 
                background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Subtle Desktop Hover Interaction */
        @media (hover: hover) {
            .link-btn:hover { 
                background-color: rgba(255, 255, 255, 0.15); 
                border-color: rgba(255, 255, 255, 0.4); 
                color: #ffffff; 
                transform: translateY(-2px); 
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            }
        }

        /* Smooth Mobile Press Action */
        .link-btn:active { 
            transform: translateY(0) scale(0.97);
            background-color: rgba(255, 255, 255, 0.04); 
            border-color: rgba(255, 255, 255, 0.1);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="avatar" src="https://github.com/achleitner.png" alt="Logo">
        
        <div class="links-stack">
            <a href="https://github.com/achleitner" class="link-btn" target="_blank" rel="noopener noreferrer">github</a>
            <a href="https://instagram.com/kingstrapscom" class="link-btn" target="_blank" rel="noopener noreferrer">@kingstrapscom</a>
            <a href="https://instagram.com/kingfluxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingfluxxx</a>
            <a href="https://instagram.com/kingchain.z" class="link-btn" target="_blank" rel="noopener noreferrer">@kingchainz</a>
            <a href="https://instagram.com/kingclique" class="link-btn" target="_blank" rel="noopener noreferrer">@kingclique</a>
            <a href="https://instagram.com/kingtraxx.x" class="link-btn" target="_blank" rel="noopener noreferrer">@kingtraxxx</a>
            <a href="https://instagram.com/ss5.me" class="link-btn" target="_blank" rel="noopener noreferrer">@ss5.me</a>
        </div>
    </div>

</body>
</html>
